tunnels:
  name: Tunnels
  level: 2
  battle_special_rules: " Whilst it controls this Territory, the gang may choose to have up to three fighters deploy via tunnels ahead of any battle. These fighters must be part of the crew for the battle, but instead of being set up on the battlefield, they are placed to one side. During the Deployment phase, the player sets up two 2-inch wide tunnel entrance markers on any table edge on the ground surface of the battlefield. During the Priority phase of each turn, roll a D6. On a 4+, the group of fighters arrive on the battlefield. That turn they may be activated as a single group, and must move onto the battlefield from one of the tunnel entrance markers. The members of the group must all arrive through the same tunnel entrance. If the battle ends before the fighters arrive, they take no part in the battle."
  battle_special_rules_orlock: " Whilst it controls this Territory, the gang may choose to have up to six fighters (If 4 or more fighters are selected, then those fighters must split into two equally sized groups. If 3 or less fighters they deploy as a single group) deploy via tunnels ahead of any battle. These fighters must be part of the crew for the battle, but instead of being set up on the battlefield, they are placed to one side. During the Deployment phase, the player sets up two 2-inch wide tunnel entrance markers on any table edge on the ground surface of the battlefield. During the Priority phase of each turn, roll a D6 and resolve separately for each group: On a 4+, the group of fighters arrive on the battlefield. That turn they may be activated as a single group, and must move onto the battlefield from one of the tunnel entrance markers. The members of the group must all arrive through the same tunnel entrance. If the battle ends before the fighters arrive, they take no part in the battle."
  battle_special_rules_genestealer_cult: " Whilst it controls this Territory, the gang may choose to have up to six fighters (If 4 or more fighters are selected, then those fighters must split into two equally sized groups. If 3 or less fighters they deploy as a single group) deploy via tunnels ahead of any battle. These fighters must be part of the crew for the battle, but instead of being set up on the battlefield, they are placed to one side. During the Deployment phase, the player sets up two 2-inch wide tunnel entrance markers on any table edge on the ground surface of the battlefield. During the Priority phase of each turn, roll a D6 and resolve separately for each group: On a 4+, the group of fighters arrive on the battlefield. That turn they may be activated as a single group, and must move onto the battlefield from one of the tunnel entrance markers. The members of the group must all arrive through the same tunnel entrance. If the battle ends before the fighters arrive, they take no part in the battle."
  reputation_orlock: "Whilst it controls this Territory, the gang adds +1 to its Reputation."
  reputation_genestealer_cult: "Whilst it controls this Territory, the gang adds +1 to its Reputation."
  campaign: 0 # 1= include, 0 = exclude

toll_crossing:
