  scenario_selection_special_rules_ash_waste_nomads: "Homeground - If challenged in the Takeover phase, the ensuing battle will automatically take place within the Nomads' Outpost, representing a bold gang assaulting the outpost."
  trading_special_rules_ash_waste_nomads: "In the Takeover phase, if a challenging gang defeated this gang at the Nomads' Outpost (i.e. Homeground battle took place) that gang will gain +5 Reputation."
  campaign: 1 # 1= include, 0 = exclude

