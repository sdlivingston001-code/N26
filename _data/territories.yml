# territories.yml
#
# One top-level key per territory (used as its `id`). Common fields:
#   name             - Display name.
#   level            - Territory tier (1-3), used to group the selector UI.
#   income           - Income block; either `{ schema: <name> }` (see
#                      territorySchemas.js for available schemas and their
#                      defaults) or an inline override of schema fields
#                      (count/sides/multiplier/addition/event/etc.).
#   random_recruit   - Recruit block; same schema-reference pattern as
#                      `income`, resolved against TerritorySchemas.recruitSchemas.
#   reputation, battle_special_rules, trading_special_rules,
#   scenario_selection_special_rules, fixed_recruit, fixed_gear
#                    - Free-text rule blocks rendered as-is.
#   campaign         - 1 to include this territory in the tool, 0 to exclude.
#
# Gang-specific overrides:
#   Append `_<gangId>` to any of the above keys (e.g. `income_cawdor`,
#   `random_recruit_corpse_grinder_cult`) to override that property only
#   when the matching gang is selected. `<gangId>` matches a key in gangs.yml
#   (or its `dominionGangId`). TerritorySchemas.resolveTerritory() applies
#   these overrides automatically.

settlement:
  name: Settlement
  level: 1
  income:
    schema: standard
  random_recruit:
    schema: standard
  random_recruit_corpse_grinder_cult:
    schema: standard
    outcomes: {
      "0": "No new recruits.",
      "1": "Recruit an Initiate for free.",
      "2": "Recruit a Skinner for free."}
  random_recruit_helot_cultists:
    schema: standard
    outcomes: {
      "0": "No new recruits.",
      "1": "Recruit a Helot Cultist for free.",
      "2": "Recruit two Helot Cultists for free."}
  random_recruit_genestealer_cult:
    schema: standard
    outcomes: {
      "0": "No new recruits.",
      "1": "Recruit a Neophyte Hybrid for free.",
      "2": "Recruit a three-armed Early Generation Neophyte Hybrid for free."}
  reputation: "Whilst it controls this Territory, the gang adds +1 to its Reputation."
  campaign: 1 # 1= include, 0 = exclude

spyrer_base_camp:
  name: Spyrer Base Camp
  level: 1
  trading_special_rules_spyrers: "<b>Recovery Systems</b>: During the Wrap-up of each battle the Spyre Hunting Party gang takes part in, one Spyrer may perform post-battle actions even if they are in Convalescence. A Spyre Hunting Party gang may never lose control of their Spyrer Base Camp Territory."
  campaign: 1 # 1= include, 0 = exclude

