    multiplier: 5 # Override default multiplier of 10
  battle_special_rules_orlock: "Whilst it controls this Territory, the gang has Priority in the first round of any battle. Any gang in the campaign may pay the gang 20 credits to gain the same benefit in a single battle against another gang."
  battle_special_rules_genestealer_cult: "Whilst it controls this Territory, the gang has Priority in the first round of any battle. Any gang in the campaign may pay the gang 20 credits to gain the same benefit in a single battle against another gang."
  campaign: 1 # 1= include, 0 = exclude

generatorium:
  name: Generatorium
  level: 2
  battle_special_rules: "If their gang controls this Territory, a player may choose to stall the generators, temporarily cutting the power to the area in which a battle is taking place and plunging it into darkness. The player may declare they will do this at the beginning of any Priority phase, before the roll for Priority. For the remainder of the battle, the Pitch Black rules (see Core Rulebook p.193) are in effect. However, at the start of each End phase, there is a chance that the generators will automatically restart and the lights flood back. At the start of each End phase, before making any Bottle checks, the player that controls this Territory rolls a D6. If the result is a 5 or more, the generators restart and the Pitch Black rules immediately cease to be in effect. If the roll is a 1-4, the generators stay silent."
  reputation_van_saar: "Whilst it controls this Territory, the gang adds +1 to its Reputation."
  campaign: 1 # 1= include, 0 = exclude

archaeotech_device:
  name: Archaeotech Device
  level: 2
  battle_special_rules: " Any number of weapons owned by the gang may be given <b>one</b> of the following Traits for free: <b>Blaze, Rad-phage, Seismic, or Shock</b>. All weapons must be given the same Trait and new weapons purchased later may also be given this Trait. These weapons also gain the <b>Unstable</b> Trait. If the Territory is lost, the weapons lose these additional Traits."
  battle_special_rules_van_saar: " The gang may give any number of weapons it owns <b>two</b> of the following Traits for free: <b>Blaze, Rad-phage, Seismic, or Shock</b>. All weapons must be given the same Traits and new weapons purchased later may also be given these Traits. These weapons also gain the <b>Unstable</b> trait. If the Territory is lost, the weapons lose these additional Traits."
  reputation_van_saar: "Whilst it controls this Territory, the gang adds +2 to its Reputation."
  campaign: 1 # 1= include, 0 = exclude

tech_bazaar:
  name: Tech Bazaar
  level: 2
  income:
    schema: standard
  income_van_saar:
    schema: conditional
    required_territory: archaeotech_device
    conditional_count: 2 # If required territory is also selected, roll 2 dice instead of 1
  reputation_van_saar: "Whilst it controls this Territory, the gang adds +1 to its Reputation."
  trading_special_rules: "Select one Leader or Champion to make a Haggle post-battle action. Roll 2D6. The gang may immediately choose one Rare (X) item from the Trading Post where X is less than or equal to the dice roll and add it to their Stash for half of its usual value, rounded down. If the roll is lower than 7, pick a Common weapon or piece of equipment to add to the gang’s Stash for half of its usual value, rounded down. If the roll is 3 or lower, then the fighter proves to be very poor at haggling and no equipment is gained. If the fighter selected has Exotic Furs, add +1 to the result of the 2D6 dice roll."
  campaign: 1 # 1= include, 0 = exclude