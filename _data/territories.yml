  level: 1
  income_enforcers:
    schema: standard
  reputation_enforcers: "Whilst it controls this Territory, the gang adds +1 to its Reputation."
  trading_special_rules_enforcers: "If this gang deleted at least one fighter from their Gang Roster this postbattle sequence, they may add a single Palanite Enforcer Rookie to their gang for free."
  campaign: 1 # 1= include, 0 = exclude

