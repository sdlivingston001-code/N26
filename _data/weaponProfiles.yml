# weaponProfiles.yml
#
# weapon_profiles.<weaponId>.profiles.<profileId> - Selectable ranged weapon
#   presets for the Shooting Sequence tool (tools/shooting.html). Each
#   weapon groups one or more profiles (different ammo types), matching the
#   pattern used by scenario_MeatForTheGrinder.yml.
#
# Profile fields:
#   name         - Display name shown in the weapon-profile selector.
#   category     - Weapon category (e.g., Auto/Stub, Bolt, Flamer).
#   short_range, long_range  - Short/Long range in inches. short_range: 0 + long_range: 0 typically indicates the weapon will have the "Template" trait instead of range bands.
#   strength     - Strength characteristic, used for the Wound roll.
#   ap           - Armour Piercing modifier applied to the target's Save roll (negative values make the Save harder).
#   lethality    - Number of Injury dice rolled when this weapon takes a model's Wounds to zero.
#   traits       - Array of weapon-trait names (cross-referenced against weaponTraits.yml). "Rapid Fire(X)" includes its X value inline so the engine can parse it directly.
#   credits      - Cost of weapon in credits.
#   trade_points - Number of Trade Points to be spent in addition to the credit cost.

schema:
  weapon:
    name: string
    category: string
    short_range: integer
    long_range: integer
    strength: integer
    ap: integer
    lethality: integer
    traits:
      - string
    credits: integer
    trade_points: integer

