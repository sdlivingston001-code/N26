# xpTables.yml
#
# advancements_userchoice - Static reference table of XP-spend options
#   (cost, advancement text, ratingIncrease). Rows with a `sides` field
#   get a "Roll for Skill" button in the UI, linking to a skill table below.
#
# advancements_random - The 2D6 random advancement table (`results`), each
#   entry keyed by an internal ID with `values` (matching roll(s)),
#   `advancement` text, and `ratingIncrease`.
#
# skills.<skillTableName> - One entry per skill table (e.g. skill_agility).
#   `gang` and `class` classify the table for the skill-roller dialog's
#   grouping/labels. `sides` is either a number (D6 table, entries keyed
#   1-6) or "d66" (D66 table, entries live under `results` with a
#   `values` range). Individual skill entries may include `cost` (credits),
#   `exotic_beast: true` (usable by Exotic Beast fighters), and
#   `conditional_special` (extra text shown for certain classes, e.g. Wyrd).

advancements_userchoice:
  choose_primary_skill:
    cost: 5
    advancement: "Select PRIMARY skill."
    ratingIncrease: 20
  random_secondary_skill:
    cost: 5
    advancement: "Random SECONDARY skill."
    ratingIncrease: 20
  choose_secondary_skill:
    cost: 7
    advancement: "Select SECONDARY skill."
    ratingIncrease: 30
  random_any_skill:
    cost: 12
    advancement: "Random non-gang affiliated Skill."
    ratingIncrease: 30
  random_legendary_name:
    cost: 2
    advancement: "Random Legendary Name (Orlocks only)."
    ratingIncrease: 5
  choose_legendary_name:
    cost: 4
    advancement: "Select Legendary Name (Orlocks only)."
    ratingIncrease: 5
  random_spyrer_power_boost:
    cost: "4 Kill Count"
    advancement: "Random Spyrer Suit Evolution."
    ratingIncrease: "Varies"
  get_promoted:
    cost: 5
    advancement: "If you meet all the special rule criteria on the fighter card, then trigger the fighters' promotion rule!"
    ratingIncrease: 0

advancements_random:
  sides: 6
  count: 2
  results:
    become_specialist:
      values: [2]
      advancement: "Become a SPECIALIST! Select a PRIMARY skill."
      ratingIncrease: 20
    random_secondary_skill:
      values: [3-5]
      advancement: "Random SECONDARY skill."
      ratingIncrease: 20
    random_primary_skill:
      values: [6-7]
      advancement: "Random PRIMARY skill."
      ratingIncrease: 20
    choose_primary_skill:
      values: [8-10]
      advancement: "Select PRIMARY skill."
      ratingIncrease: 20
    choose_secondary_skill:
      values: [11-12]
      advancement: "Select SECONDARY skill."
      ratingIncrease: 30

