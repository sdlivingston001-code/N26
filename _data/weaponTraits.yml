# weaponTraits.yml
#
# weapon_traits.<TraitName> - One entry per weapon trait (Blaze, Disarm,
#   Knockback, etc.). `name` is the display heading; `description` is raw
#   HTML (rendered as-is) explaining the rule, referenced from the
#   scavenged-weapon table in scenario_MeatForTheGrinder.yml and rendered
#   as a collapsible reference section by scenario_MeatForTheGrinderUI.js.

weapon_traits:
  Ammo:
    name: Ammo
    description: |
      <p><b>Ammo (X+):</b> After an attack with this weapon is resolved, roll 1D6; <u>if the result is below X</u> the weapon runs <b>Out of Ammo</b> and cannot be used again until a <b>Reload</b> action is performed. If this weapon also has the <b>Rapid Fire (X)</b> trait, this check is not made separately &mdash; instead the weapon is considered to have rolled <u>one additional ammo symbol</u> when resolving its Firepower dice.</p>

  Blaze:
    name: Blaze
    description: |
      <p><b>Blaze (X+):</b> If the wound roll is at least X then resolve an additional hit (which cannot proc additional hits).</p>

  Rapid_Fire:
    name: Rapid Fire
    description: |
      <p><b>Rapid Fire (X):</b> Roll the firepower dice to determine how many hits this weapon scores.</p>

  Template:
    name: Template
    description: |
      <p><b>Template:</b> Instead of making a hit roll, attacks with this weapon use the <b>Flame template</b>. Any model whose base is within the template — or whose base the template passes over — is automatically hit. Partially covered bases are hit on a 4+ roll.</p>
