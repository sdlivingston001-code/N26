<!--
  rules-section.html — Renders one Rule Summary section, and its child
  sections if it has any, from the rules_sections collection
  (see _rules_sections/*.md). Each section's Markdown body is
  pre-converted to HTML by Jekyll, so its "content" attribute is
  ready-to-use HTML, not raw Markdown.

  Usage: include this file with a "section" parameter (a collection
  document) and a "group" parameter (an entry from _data/rulesGroups.yml);
  tools/rules.html loops over every group and its top-level sections in
  order.

  Front matter read from each _rules_sections/*.md document:
    title   - Display heading for the section.
    slug    - (top-level only) unique id, used as the section's anchor id
              and referenced by children.
    group   - (top-level only) id of a group in _data/rulesGroups.yml;
              groups are the headings in the navigation drawer.
    parent  - (children only) slug of the section this one nests under.
    order   - Sort order among siblings.

  A top-level section's id is its slug; a child's id is the parent slug +
  "-" + slugified title (e.g. actions-engaged), so Markdown can link to
  either: [text](#movement). Sections with children get a drill-down in
  the navigation drawer. pageNav.js shows the right section or child.
-->
{% assign section = include.section %}
{% assign children = site.rules_sections | where: "parent", section.slug | sort: "order" %}
<details class="reference-tables-collapsible" id="{{ section.slug }}" data-nav-group="{{ include.group.id }}" data-nav-group-title="{{ include.group.title }}">
  <summary>{{ section.title }}</summary>
  <div class="page-nav-body">{{ section.content }}</div>
  {% for child in children %}
  <details class="reference-tables-collapsible" id="{{ section.slug }}-{{ child.title | slugify }}" data-nav-child>
    <summary>{{ child.title }}</summary>
    {{ child.content }}
  </details>
  {% endfor %}
</details>
