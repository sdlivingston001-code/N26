<!--
  rules-traits.html — Renders _data/weaponTraits.yml as one plain collapsible
  per trait. (The same data is also served as JSON for the Shooting tool.)
-->
{% for entry in site.data.weaponTraits.weapon_traits %}
{% assign trait = entry[1] %}
{% assign trait_slug = entry[0] | slugify %}
{% assign trait_id = "weapon_traits-" | append: trait_slug %}
{% include rules-entry.html id=trait_id title=trait.name body=trait.description %}
{% endfor %}
